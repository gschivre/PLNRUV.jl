<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 320' width='780' height='320' font-family='Helvetica, Arial, sans-serif'><rect width='780' height='320' rx='8' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#59636e'/></marker></defs><text x='100' y='30' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='bold'>data Y</text><rect x='50' y='45' width='100' height='230' rx='2' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.5'/><text x='100' y='165' font-size='13' fill='#59636e' text-anchor='middle' font-weight='normal'>n × p</text><line x1='160' y1='160' x2='250' y2='160' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='205' y='148' font-size='15' fill='#1f2328' text-anchor='middle' font-weight='normal' font-style='italic'>Qᵀ</text><text x='310' y='30' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='bold'>rotated data QᵀY</text><rect x='260' y='45' width='100' height='50' rx='2' fill='#c1d4e9' stroke='#2f6fb5' stroke-width='1.5'/><text x='375' y='68.0' font-size='13' fill='#2f6fb5' text-anchor='start' font-weight='bold'>nuisance rows (k − 1)</text><text x='375' y='86.0' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>intercept and other covariates: dropped</text><rect x='260' y='95' width='100' height='30' rx='2' fill='#f4dabf' stroke='#d9822b' stroke-width='1.5'/><text x='375' y='108.0' font-size='13' fill='#d9822b' text-anchor='start' font-weight='bold'>row of interest (1)</text><text x='375' y='126.0' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>bⱼ = βⱼ + Γⱼᵀα + noise: confounded effect</text><rect x='260' y='125' width='100' height='150' rx='2' fill='#d7cee4' stroke='#7b5aa6' stroke-width='1.5'/><text x='375' y='198.0' font-size='13' fill='#7b5aa6' text-anchor='start' font-weight='bold'>residual rows (n − k)</text><text x='375' y='216.0' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>factors and noise only: estimate Γⱼ and σⱼ²</text><path d='M640,205 C720,195 720,120 650,108' fill='none' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='725' y='160' font-size='12' fill='#7b5aa6' text-anchor='start' font-weight='normal' font-style='italic'>Γⱼ, σⱼ²</text><text x='390' y='305' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>Q comes from the QR decomposition of the design X. The rotation keeps the noise independent.</text></svg>