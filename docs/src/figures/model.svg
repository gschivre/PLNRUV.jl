<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 360' width='760' height='360' font-family='Helvetica, Arial, sans-serif'><rect width='760' height='360' rx='8' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#59636e'/></marker></defs><rect x='60' y='40' width='150' height='50' rx='6' fill='#e0e9f4' stroke='#2f6fb5' stroke-width='1.5'/><text x='135' y='62' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='normal'>design xᵢ</text><text x='135' y='80' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>(condition, batch…)</text><rect x='60' y='130' width='150' height='50' rx='6' fill='#ebe6f2' stroke='#7b5aa6' stroke-width='1.5'/><text x='135' y='152' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='normal'>hidden factors wᵢ₁…wᵢq</text><text x='135' y='170' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>(cell mix, RNA quality…)</text><rect x='60' y='220' width='150' height='50' rx='6' fill='#f9ecdf' stroke='#d9822b' stroke-width='1.5'/><text x='135' y='242' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='normal'>offset factor wᵢ₀</text><text x='135' y='260' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>(total RNA per cell)</text><line x1='135' y1='92' x2='135' y2='128' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)' stroke-dasharray='5,4'/><text x='125' y='114' font-size='14' fill='#7b5aa6' text-anchor='end' font-weight='normal' font-style='italic'>α</text><path d='M80,92 C30,140 30,200 72,218' fill='none' stroke='#59636e' stroke-width='1.6' stroke-dasharray='5,4' marker-end='url(#a)'/><text x='30' y='160' font-size='14' fill='#d9822b' text-anchor='middle' font-weight='normal' font-style='italic'>α₀</text><rect x='300' y='110' width='200' height='90' rx='6' fill='#e1ede5' stroke='#3a8a4f' stroke-width='1.5'/><text x='400' y='138' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='normal'>latent log-abundance</text><text x='400' y='160' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='normal'>Zᵢⱼ = xᵢᵀBⱼ + wᵢᵀΓⱼ + εᵢⱼ</text><text x='400' y='182' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>εᵢⱼ ~ N(0, σⱼ²)</text><line x1='212' y1='65' x2='298' y2='130' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='255' y='88' font-size='14' fill='#2f6fb5' text-anchor='middle' font-weight='normal' font-style='italic'>Bⱼ</text><line x1='212' y1='155' x2='298' y2='155' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='255' y='147' font-size='14' fill='#7b5aa6' text-anchor='middle' font-weight='normal' font-style='italic'>Γⱼ</text><line x1='212' y1='245' x2='298' y2='180' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='232' y='272' font-size='12' fill='#d9822b' text-anchor='middle' font-weight='normal'>loading 1</text><rect x='570' y='110' width='160' height='90' rx='6' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.5'/><text x='650' y='138' font-size='14' fill='#1f2328' text-anchor='middle' font-weight='normal'>count yᵢⱼ</text><text x='650' y='160' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='normal'>Poisson(exp(oᵢ + Zᵢⱼ))</text><text x='650' y='182' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>oᵢ = log library size</text><line x1='502' y1='155' x2='568' y2='155' stroke='#59636e' stroke-width='1.6' marker-end='url(#a)'/><text x='400' y='240' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>biology: effects add on the log scale</text><text x='650' y='240' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>measurement</text><text x='380' y='300' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>Dashed arrows: the hidden factors may be correlated with the design (coefficients α).</text><text x='380' y='320' font-size='12' fill='#59636e' text-anchor='middle' font-weight='normal'>The offset factor wᵢ₀ is the first entry of wᵢ. Its loading is 1 for every gene: Γ₀ⱼ = 1.</text></svg>