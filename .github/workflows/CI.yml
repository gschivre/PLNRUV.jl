name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Pkg.test currently fails to resolve the Test stdlib in its sandbox ("expected package Test to be
      # registered", on every Julia version): the test environment is built with Pkg.add and Pkg.develop instead
      - name: Build the test environment
        run: julia --project=testenv -e 'using Pkg; Pkg.add(["Aqua", "Distributions", "Random", "Statistics", "Test"]); Pkg.develop(path = ".")'
      - name: Run the tests
        run: julia --project=testenv --check-bounds=yes --depwarn=yes test/runtests.jl
